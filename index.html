<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desafio Space Donor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 90vh;
            max-height: 640px;
            background: #000;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: 28px;
            color: #00ffcc;
            text-shadow: 2px 2px #ff0055;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 25px;
            color: #e0e0e0;
        }
        button {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #990033;
            transition: transform 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #990033;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
            padding: 0 10px;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            width: 60px;
            height: 50px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .btn-ctrl:active {
            background: rgba(0, 255, 200, 0.4);
        }
        #btn-fire {
            width: 90px;
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ff0055;
        }
        #btn-fire:active {
            background: rgba(255, 0, 85, 0.5);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Tela Inicial -->
    <div id="screen-start" class="overlay">
        <h1>Desafio Space Donor</h1>
        <button id="btn-start">INICIAR JOGO</button>
    </div>

    <!-- Tela de Introdução -->
    <div id="screen-intro" class="overlay hidden">
        <p>Alcance a doação, vencendo os maiores obstáculos do universo!</p>
        <button id="btn-begin">COMEÇAR</button>
    </div>

    <!-- Modal do Mito/Obstáculo Destruído -->
    <div id="screen-myth" class="overlay hidden">
        <h1 id="myth-title" style="font-size: 20px; color: #ff0055;"></h1>
        <p id="myth-text"></p>
        <button id="btn-continue">CONTINUAR</button>
    </div>

    <!-- Tela Final / Vitória -->
    <div id="screen-victory" class="overlay hidden">
        <h1 style="color: #00ffcc;">MISSÃO CUMPRIDA!</h1>
        <p style="font-size: 18px; font-weight: bold; color: #fff;">
            A doação de órgãos salva vidas, avise a sua família.
        </p>
        <button onclick="location.reload()">JOGAR NOVAMENTE</button>
    </div>

    <!-- Controles na Tela para Mobile -->
    <div id="controls" class="hidden">
        <div class="btn-ctrl" id="btn-left">◄</div>
        <div class="btn-ctrl" id="btn-fire">FOGO</div>
        <div class="btn-ctrl" id="btn-right">►</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Ajustar tamanho do canvas
    canvas.width = 400;
    canvas.height = 600;

    // --- CARREGAMENTO DAS IMAGENS EM BASE64 ---
    const playerImg = new Image();
    playerImg.src = "data:image/png;base64,COLE_AQUI_O_BASE64_DA_NAVE"; // Substitua pela string Base64 da Nave

    const obstacleImg = new Image();
    obstacleImg.src = "data:image/png;base64,COLE_AQUI_O_BASE64_DO_METEORO"; // Substitua pela string Base64 do Meteoro

    // Elementos de Interface
    const screenStart = document.getElementById('screen-start');
    const screenIntro = document.getElementById('screen-intro');
    const screenMyth = document.getElementById('screen-myth');
    const screenVictory = document.getElementById('screen-victory');
    const controls = document.getElementById('controls');
    
    const mythTitle = document.getElementById('myth-title');
    const mythText = document.getElementById('myth-text');

    // Botões
    document.getElementById('btn-start').addEventListener('click', () => {
        screenStart.classList.add('hidden');
        screenIntro.classList.remove('hidden');
    });

    document.getElementById('btn-begin').addEventListener('click', () => {
        screenIntro.classList.add('hidden');
        controls.classList.remove('hidden');
        gameRunning = true;
        initAudio();
        requestAnimationFrame(update);
    });

    document.getElementById('btn-continue').addEventListener('click', () => {
        screenMyth.classList.add('hidden');
        gamePaused = false;
        requestAnimationFrame(update);
    });

    // Áudio Sintetizado
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playLaserSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    function playExplosionSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // Lista de Obstáculos Nomeados
    const namedObstacles = [
        { label: "Negativa Familiar", text: "A família é quem autoriza a doação. Informar seus parentes em vida é a chave para transformar essa decisão." },
        { label: "Corpo Deformado", text: "Mito! A retirada dos órgãos é uma cirurgia respeitosa e o corpo não fica deformado para o sepultamento." },
        { label: "Motivos Religiosos", text: "A maioria das grandes religiões apoia expressamente a doação de órgãos como um ato supremo de amor." },
        { label: "Manutenção do Doador", text: "A manutenção hemodinâmica adequada é essencial na UTI para garantir a viabilidade dos órgãos a serem doados." },
        { label: "Diagnóstico Tardio", text: "A agilidade na abertura do protocolo de Morte Encefálica viabiliza o processo e reduz a perda de doadores." },
        { label: "Parada Cardíaca", text: "Complicações hemodinâmicas graves podem levar à perda do doador antes do processo de doação." },
        { label: "Recusa de Protocolo", text: "Falta de conhecimento da equipe pode atrasar a identificação do potencial doador." }
    ];

    let pendingObstacles = [...namedObstacles];
    let destroyedNamedCount = 0;
    const totalNamedCount = namedObstacles.length;

    // Estado do Jogo
    let gameRunning = false;
    let gamePaused = false;
    let victoryPhase = false;

    // Entidades (Nave posicionada mais para cima: canvas.height - 110)
    const player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 110,
        width: 40,
        height: 40,
        speed: 5,
        dx: 0
    };

    let bullets = [];
    let obstacles = [];
    let fallingOrgans = [];
    let spawnTimer = 0;

    // Estrelas de Fundo
    const stars = Array.from({ length: 40 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() > 0.8 ? 2 : 1,
        speed: Math.random() * 0.5 + 0.2
    }));

    // Entradas do Usuário
    const keys = {};

    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' && gameRunning && !gamePaused && !victoryPhase) {
            shoot();
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    // Controles Touch
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnFire = document.getElementById('btn-fire');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowLeft'] = true; });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowLeft'] = false; });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys['ArrowRight'] = true; });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys['ArrowRight'] = false; });
    btnFire.addEventListener('touchstart', (e) => { 
        e.preventDefault(); 
        if (gameRunning && !gamePaused && !victoryPhase) shoot(); 
    });

    function shoot() {
        bullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y,
            width: 4,
            height: 10,
            speed: 7
        });
        playLaserSound();
    }

    function spawnObstacle() {
        let isNamed = false;
        let data = null;

        if (pendingObstacles.length > 0 && Math.random() < 0.6) {
            isNamed = true;
            data = pendingObstacles.shift();
        }

        obstacles.push({
            x: Math.random() * (canvas.width - 90),
            y: -50,
            width: 90,
            height: 45,
            speed: 1.2,
            isNamed: isNamed,
            label: isNamed ? data.label : "Obstáculo",
            text: isNamed ? data.text : ""
        });
    }

    function triggerVictorySequence() {
        victoryPhase = true;
        controls.classList.add('hidden');
        
        const organTypes = ['❤️', '🫁', '🫀'];
        for (let i = 0; i < 12; i++) {
            fallingOrgans.push({
                x: (i % 6) * 65 + 20,
                y: -50 - Math.floor(i / 6) * 60,
                symbol: organTypes[i % organTypes.length],
                speed: 1.5
            });
        }
    }

    // Loop de Atualização
    function update() {
        if (!gameRunning || gamePaused) return;

        if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -player.speed;
        else if (keys['ArrowRight'] || keys['KeyD']) player.dx = player.speed;
        else player.dx = 0;

        player.x += player.dx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        bullets.forEach((b, index) => {
            b.y -= b.speed;
            if (b.y < -10) bullets.splice(index, 1);
        });

        if (!victoryPhase) {
            spawnTimer++;
            if (spawnTimer > 120) {
                spawnObstacle();
                spawnTimer = 0;
            }

            obstacles.forEach((obs, oIndex) => {
                obs.y += obs.speed;

                bullets.forEach((b, bIndex) => {
                    if (b.x < obs.x + obs.width &&
                        b.x + b.width > obs.x &&
                        b.y < obs.y + obs.height &&
                        b.y + b.height > obs.y) {
                        
                        playExplosionSound();
                        bullets.splice(bIndex, 1);

                        if (obs.isNamed) {
                            destroyedNamedCount++;
                            gamePaused = true;
                            mythTitle.innerText = obs.label;
                            mythText.innerText = obs.text;
                            screenMyth.classList.remove('hidden');
                        }
                        
                        obstacles.splice(oIndex, 1);

                        if (destroyedNamedCount >= totalNamedCount) {
                            triggerVictorySequence();
                        }
                    }
                });

                if (obs.y > canvas.height) {
                    if (obs.isNamed) {
                        pendingObstacles.push({ label: obs.label, text: obs.text });
                    }
                    obstacles.splice(oIndex, 1);
                }
            });
        } else {
            fallingOrgans.forEach((organ) => {
                organ.y += organ.speed;
            });

            if (fallingOrgans.length > 0 && fallingOrgans[0].y >= player.y - 30) {
                gameRunning = false;
                setTimeout(() => {
                    screenVictory.classList.remove('hidden');
                }, 500);
            }
        }

        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > canvas.height) star.y = 0;
        });

        draw();

        if (gameRunning && !gamePaused) {
            requestAnimationFrame(update);
        }
    }

    // Renderização Visual
    function draw() {
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.fillStyle = '#ffffff';
        stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

        // Desenhar Nave (Imagem Base64 ou Fallback Pixel Art)
        if (playerImg.complete && playerImg.naturalWidth !== 0) {
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(player.x + 16, player.y, 8, 8);
            ctx.fillRect(player.x + 8, player.y + 8, 24, 8);
            ctx.fillRect(player.x, player.y + 16, 40, 16);
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(player.x + 4, player.y + 32, 8, 8);
            ctx.fillRect(player.x + 28, player.y + 32, 8, 8);
        }

        // Desenhar Tiros
        ctx.fillStyle = '#ffcc00';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // Desenhar Meteoro (Imagem Base64 ou Fallback Pixel Art)
        obstacles.forEach(obs => {
            if (obstacleImg.complete && obstacleImg.naturalWidth !== 0) {
                ctx.drawImage(obstacleImg, obs.x, obs.y, obs.width, obs.height);
            } else {
                ctx.fillStyle = obs.isNamed ? '#8b4513' : '#555555';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = obs.isNamed ? '#a0522d' : '#777777';
                ctx.fillRect(obs.x + 4, obs.y + 4, obs.width - 8, obs.height - 8);
            }

            // Texto dentro do Meteoro
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(obs.label, obs.x + obs.width / 2, obs.y + obs.height / 2 + 4);
        });

        // Desenhar Órgãos caindo na vitória
        if (victoryPhase) {
            ctx.font = '24px serif';
            ctx.textAlign = 'center';
            fallingOrgans.forEach(o => {
                ctx.fillText(o.symbol, o.x, o.y);
            });
        }
    }
</script>
</body>
</html>
